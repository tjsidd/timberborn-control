[project]
name = "timberborn-control"
version = "0.1.0"
description = "Local service and dashboard for Timberborn automation HTTP components."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.5.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[project.scripts]
timberborn-control = "timberborn_control.api:run"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
